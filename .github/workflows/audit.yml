name: Web Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Scheduled run: every Monday at 8:00 UTC
  schedule:
    - cron: '0 8 * * 1'
  # Manual trigger with custom URL
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to audit'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

env:
  AUDIT_TARGET_URL: ${{ github.event.inputs.target_url || 'http://localhost:3939' }}

jobs:
  # ──────────────────────────────────────────────
  # LINT & TYPECHECK
  # ──────────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck

  # ════════════════════════════════════════════════
  # CYPRESS AUDITS
  # ════════════════════════════════════════════════

  cy-accessibility:
    name: 'Cypress: Accessibility'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Start demo server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx serve demo -p 3939 &

      - name: Wait for server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx wait-on http://localhost:3939 --timeout 30000

      - name: Run accessibility audit
        run: |
          npx cypress run \
            --config baseUrl=${{ env.AUDIT_TARGET_URL }} \
            --spec "cypress/e2e/accessibility/**/*.cy.ts" \
            --browser chrome \
            --headless
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cy-accessibility-results
          path: reports/
          retention-days: 30

  cy-seo:
    name: 'Cypress: SEO'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Start demo server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx serve demo -p 3939 &

      - name: Wait for server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx wait-on http://localhost:3939 --timeout 30000

      - name: Run SEO audit
        run: |
          npx cypress run \
            --config baseUrl=${{ env.AUDIT_TARGET_URL }} \
            --spec "cypress/e2e/seo/**/*.cy.ts" \
            --browser chrome \
            --headless
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cy-seo-results
          path: reports/
          retention-days: 30

  cy-best-practices:
    name: 'Cypress: Best Practices'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Start demo server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx serve demo -p 3939 &

      - name: Wait for server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx wait-on http://localhost:3939 --timeout 30000

      - name: Run best practices audit
        run: |
          npx cypress run \
            --config baseUrl=${{ env.AUDIT_TARGET_URL }} \
            --spec "cypress/e2e/best-practices/**/*.cy.ts" \
            --browser chrome \
            --headless
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cy-best-practices-results
          path: reports/
          retention-days: 30

  # ════════════════════════════════════════════════
  # PLAYWRIGHT AUDITS
  # ════════════════════════════════════════════════

  pw-accessibility:
    name: 'Playwright: Accessibility'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start demo server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx serve demo -p 3939 &

      - name: Wait for server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx wait-on http://localhost:3939 --timeout 30000

      - name: Run accessibility audit
        run: npx playwright test playwright/tests/accessibility/
        env:
          AUDIT_URL: ${{ env.AUDIT_TARGET_URL }}
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pw-accessibility-results
          path: reports/
          retention-days: 30

  pw-seo:
    name: 'Playwright: SEO'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start demo server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx serve demo -p 3939 &

      - name: Wait for server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx wait-on http://localhost:3939 --timeout 30000

      - name: Run SEO audit
        run: npx playwright test playwright/tests/seo/
        env:
          AUDIT_URL: ${{ env.AUDIT_TARGET_URL }}
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pw-seo-results
          path: reports/
          retention-days: 30

  pw-best-practices:
    name: 'Playwright: Best Practices'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start demo server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx serve demo -p 3939 &

      - name: Wait for server
        if: env.AUDIT_TARGET_URL == 'http://localhost:3939'
        run: npx wait-on http://localhost:3939 --timeout 30000

      - name: Run best practices audit
        run: npx playwright test playwright/tests/best-practices/
        env:
          AUDIT_URL: ${{ env.AUDIT_TARGET_URL }}
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pw-best-practices-results
          path: reports/
          retention-days: 30

  # ════════════════════════════════════════════════
  # GENERATE REPORT & DEPLOY TO GITHUB PAGES
  # ════════════════════════════════════════════════

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs:
      - cy-accessibility
      - cy-seo
      - cy-best-practices
      - pw-accessibility
      - pw-seo
      - pw-best-practices
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Download all audit results
        uses: actions/download-artifact@v4
        with:
          path: reports/
          merge-multiple: true

      - name: Generate HTML report
        run: npx ts-node src/reporter/generate.ts
        env:
          AUDIT_OUTPUT_DIR: reports

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: reports/audit-report.html
          retention-days: 90

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
